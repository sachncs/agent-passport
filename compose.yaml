name: agent-passport

services:
  api:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      HMAC_SECRET: ${HMAC_SECRET:?Set HMAC_SECRET in .env before starting}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - agent-passport-data:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  agent-passport-data:
