server {
  listen 8080;
  server_name _;

  # Security headers — defense in depth on top of the Express helmet config
  # (the SPA can be served from a different origin than the API).
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Cache hashed assets aggressively; the index.html stays short-lived.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # Don’t serve dotfiles.
  location ~ /\.(?!well-known) {
    deny all;
  }
}