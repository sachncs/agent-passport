name: Release packages

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to publish"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "22.23.1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$version" = "$(node -p "require('./package.json').version")"
          test "$version" = "$(node -p "require('./sdk/package.json').version")"
          python_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' sdk/python/pyproject.toml)
          test "$version" = "$python_version"
      - run: npm run brand:check
      - run: npm run release:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run build --workspace=@agent-passport/sdk
      - run: npm test --workspace=@agent-passport/web
      - run: npm run build --workspace=@agent-passport/web
      - run: npm run check --prefix site
      - run: npm run build --prefix site
      - run: node scripts/ci/check-site-content.mjs site/dist
      - run: npm run docs:decision-check -- site/dist
      - run: npm run site:inventory
      - name: Inspect npm package artifacts
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/agent-passport-api-package.json
          npm pack --workspace=@agent-passport/sdk --dry-run --json > /tmp/agent-passport-sdk-package.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          for (const [file, expected] of [
            ["/tmp/agent-passport-api-package.json", `agent-passport-api-${version}.tgz`],
            ["/tmp/agent-passport-sdk-package.json", `agent-passport-sdk-${version}.tgz`],
          ]) {
            const result = JSON.parse(fs.readFileSync(file, "utf8"));
            if (result[0]?.filename !== expected || result[0]?.name === undefined) {
              throw new Error(`Unexpected package artifact in ${file}`);
            }
            if (!result[0].files?.some(({ path }) => path === "dist/index.js" || path === "dist/index.cjs")) {
              throw new Error(`Missing compiled entrypoint in ${file}`);
            }
          }
          NODE
      - run: python -m pip install -e ".[dev]"
        working-directory: sdk/python
      - run: python -m pytest
        working-directory: sdk/python
      - name: Build Python release artifact
        run: |
          python -m pip install --upgrade build
          python -m build
        working-directory: sdk/python
      - name: Inspect Python release artifact
        run: |
          set -euo pipefail
          test -n "$(find sdk/python/dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$(find sdk/python/dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --workspace=@agent-passport/sdk --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
        working-directory: sdk/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          skip-existing: true
