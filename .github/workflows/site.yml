name: Deploy Site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel in-flight runs on the same branch.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "site/package-lock.json"

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Verify output
        working-directory: site
        run: |
          test -f dist/index.html
          test -f dist/docs/index.html
          test -f dist/docs/overview/index.html
          test -f dist/docs/concepts/index.html
          test -f dist/docs/api/index.html
          test -f dist/docs/architecture/index.html
          test -f dist/docs/operations/index.html
          test -f dist/docs/security/index.html
          test -f dist/docs/openapi/index.html
          test -f dist/favicon.svg
          pages=$(find dist -name "*.html" | wc -l)
          echo "Built $pages HTML pages from Astro static output"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
